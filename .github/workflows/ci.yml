name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 版本取 package.json 的 packageManager 字段。别写 latest:
      # 2026-09 里 latest 已漂到 pnpm 12,它不再读 package.json 的
      # pnpm.overrides,--frozen-lockfile 直接 CONFIG_MISMATCH —— CI
      # 因此红了三周没人发现。换 pnpm 11+ 时把 overrides 迁去
      # pnpm-workspace.yaml,再一并升这里的版本。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Run tests
        run: pnpm test

      # packages/mcp-client 是独立包(自带 lockfile，不是 workspace 成员)，
      # 且发布到 npm —— 根 pnpm test 的 include 是 test/**，覆盖不到它。
      # 它的类型检查与测试必须单独跑，否则 CI 全绿也不代表这个包是好的。
      - name: Install mcp-client dependencies
        run: pnpm install --frozen-lockfile
        working-directory: packages/mcp-client

      - name: Type check (mcp-client)
        run: pnpm exec tsc --noEmit
        working-directory: packages/mcp-client

      - name: Test (mcp-client)
        run: pnpm test
        working-directory: packages/mcp-client
